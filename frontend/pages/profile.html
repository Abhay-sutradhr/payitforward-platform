<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile – Pay It Forward</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="fas fa-hands-helping me-2"></i>Pay It Forward</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="browse-jobs.html"><i class="fas fa-search me-1"></i>Browse Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="create-job.html"><i class="fas fa-plus-circle me-1"></i>Post Job</a></li>
          <li class="nav-item"><a class="nav-link" href="my-applications.html"><i class="fas fa-file-alt me-1"></i>Applications</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="fas fa-user-circle me-1"></i><span id="username-display">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item active" href="profile.html"><i class="fas fa-id-badge me-2"></i>Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Profile Content -->
  <div class="container py-4">
    <div id="alert-container"></div>

    <!-- Personal Details -->
    <div class="card mb-4">
      <div class="card-header"><h5><i class="fas fa-user me-2"></i>Personal Details</h5></div>
      <div class="card-body">
        <form id="profileForm">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="username" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" readonly>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="phone">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" id="address" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Changes</button>
        </form>
      </div>
    </div>

    <!-- Password Change -->
    <div class="card mb-4">
      <div class="card-header"><h5><i class="fas fa-key me-2"></i>Change Password</h5></div>
      <div class="card-body">
        <form id="passwordForm">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control" id="currentPassword" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" required minlength="6">
          </div>
          <button type="submit" class="btn btn-warning"><i class="fas fa-check me-1"></i>Update Password</button>
        </form>
      </div>
    </div>

    <!-- Statistics & Rating -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card text-center bg-light">
          <div class="card-body">
            <i class="fas fa-coins stats-icon text-primary mb-2"></i>
            <h3 id="credit-balance">0.0</h3>
            <p>Credits Available</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center bg-light">
          <div class="card-body">
            <i class="fas fa-handshake stats-icon text-success mb-2"></i>
            <h3 id="jobs-completed">0</h3>
            <p>Jobs Completed</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center bg-light">
          <div class="card-body">
            <i class="fas fa-star stats-icon text-warning mb-2"></i>
            <h3 id="average-rating">0.0</h3>
            <p>Average Rating</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
