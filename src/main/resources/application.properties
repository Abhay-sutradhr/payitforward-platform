# Application Configuration
spring.application.name=PayItForward Platform
server.port=8080

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Security Configuration temporary - will configur later
logging.level.org.springframework.security=DEBUG

# DevTools Configuration
spring.devtools.restart.enabled=true

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payitforward_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=abhay
useSSL=false&serverTimezone=UTC

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show DDL creation
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.tool.hbm2ddl=DEBUG
